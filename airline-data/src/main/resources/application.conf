websocketActorSystem {
	akka {
	  actor {
	    provider = remote
	  }
	  remote {
	    enabled-transports = ["akka.remote.netty.tcp"]
	    netty.tcp {
				#private IP of this server
	      hostname = "127.0.0.1"
	      port = 2552
				tcp-keepalive = on
	    }
	 }
	}
}

# Real-time seconds per game week (cycle). Public servers use 600 (10 minutes).
# For a local single-player game, set CYCLE_DURATION_SECONDS to something small, e.g. 30.
# 0 = start the next week as soon as the previous one finishes.
airline.cycle-duration-seconds = 600
airline.cycle-duration-seconds = ${?CYCLE_DURATION_SECONDS}

# Optional overrides (used by docker-compose for local play)
mysqldb.host = ${?MYSQL_HOST}
mysqldb.user = ${?MYSQL_USER}
mysqldb.password = ${?MYSQL_PASSWORD}
